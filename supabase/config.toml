# Ekwo OS — Supabase project configuration.
#
# `project_id` is a local label; `supabase link --project-ref <ref>` is what
# points the CLI at your own project.

project_id = "ekwo"

[db]
major_version = 15

[db.migrations]
schema_paths = []

# `supabase db reset` applies these after the migrations: every reference seed,
# in the order `ekwo init` applies them. The demo company
# (supabase/seed/90_demo_company.sql) is deliberately left out: apply it by
# hand when you want the sample data.
#
# The list between the two `generated` markers is written by `ekwo pack build`
# from supabase/seed/ and packs/, and `ekwo pack check` refuses it when it is
# not: a country is added in packs/<cc>/, never here.
[db.seed]
enabled = true
sql_paths = [
# generated:seeds
  "./seed/00_currencies.sql",
  "./seed/00_territories.sql",
  "./seed/05_framework_generic.sql",
  "./seed/10_pack_be.sql",
  "./seed/11_pack_fr.sql",
  "./seed/12_pack_lu.sql",
  "./seed/13_pack_ee.sql",
  "./seed/14_pack_gb.sql",
  "./seed/15_pack_us.sql",
  "./seed/16_pack_ie.sql",
  "./seed/17_pack_nl.sql",
  "./seed/18_pack_de.sql",
  "./seed/19_pack_es.sql",
  "./seed/20_pack_sn.sql",
  "./seed/21_pack_ci.sql",
  "./seed/22_pack_bj.sql",
  "./seed/23_pack_bf.sql",
